<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Player — a hooded scavenger with a backpack</title>

  <ellipse cx="32" cy="53" rx="14" ry="2.6" fill="#241c12" opacity="0.16"/>

  <!-- backpack, peeking out on the left -->
  <path d="M27 28 Q19 28 18 37 Q18 45 23 47 Q27 48 28 45 L28 30 Z"
        fill="#5f4632" stroke="#463a2b" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M20 30 L20 42 M24 29 L24 45" stroke="#3f3226" stroke-width="0.8" opacity="0.6"/>

  <!-- foraged sprig tucked in the pack -->
  <g stroke="#5b7a37" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M20 28 Q18.5 22.5 21 18"/>
    <path d="M20 28 l-1.5 -3.6"/>
    <path d="M20.4 26.5 l2 -3.2"/>
  </g>

  <!-- robe / cloak -->
  <path d="M27 20 Q22 30 22 42 L24 53 L40 53 L42 42 Q42 30 37 20 Z"
        fill="#7d6a4e" stroke="#463a2b" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- feet -->
  <ellipse cx="27" cy="53.3" rx="3" ry="1.3" fill="#2e2519"/>
  <ellipse cx="37" cy="53.3" rx="3" ry="1.3" fill="#2e2519"/>

  <!-- pack straps crossing the chest -->
  <path d="M28.5 21 L24.5 33 M35 21 L29 41" stroke="#3f3226" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- belt -->
  <line x1="24.5" y1="40" x2="40" y2="40" stroke="#5a3f28" stroke-width="1.4"/>
  <rect x="30.5" y="38.8" width="3" height="2.4" rx="0.5" fill="#8a5637" stroke="#463a2b" stroke-width="0.6"/>

  <!-- hood -->
  <path d="M24 22 Q23 12 32 11 Q41 12 40 22 Q41 26.5 32 27.5 Q23 26.5 24 22 Z"
        fill="#6b5a41" stroke="#463a2b" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- shadowed face under the hood -->
  <ellipse cx="32" cy="23.5" rx="4" ry="3.4" fill="#241f1a"/>

  <!-- volume: highlight left, shade right -->
  <path d="M27 20 Q22 30 22 42 L24 53 L27.5 53 L25.5 42 Q25.5 31 29.5 22 Z" fill="#ffffff" opacity="0.09"/>
  <path d="M37 20 Q42 30 42 42 L40 53 L36.5 53 L38.5 42 Q38.5 31 34.5 22 Z" fill="#000000" opacity="0.11"/>
</svg>
