<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Cave — a rocky knoll with an arched entrance</title>

  <ellipse cx="31" cy="53" rx="24" ry="3.4" fill="#241c12" opacity="0.16"/>

  <!-- small rock lump behind, upper-right -->
  <path d="M40 53 C 40 40, 45 30, 53 28 C 59 27, 61 35, 60 45 C 59.6 49, 59 52, 59 53 Z"
        fill="#8a7e6f" stroke="#463a2b" stroke-width="1"/>

  <!-- main knoll -->
  <path d="M6 53 C 5 37, 11 24, 24 21 C 32 19, 40 22, 47 29 C 53 35, 56 44, 56 53 Z"
        fill="#9c9082" stroke="#463a2b" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- strata / cracks -->
  <g stroke="#6b6156" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.8">
    <path d="M10 40 Q18 36 26 38"/>
    <path d="M33 24 Q42 27 49 35"/>
    <path d="M9 46 Q14 44 19 46"/>
  </g>

  <!-- entrance: a dark, slightly irregular arch -->
  <path d="M17 53 L17 41 Q17.5 30.5 27 30 Q36.5 30.5 37 42 L37 53 Z"
        fill="#211c17" stroke="#463a2b" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M19.5 40 Q20 32 27 31.6 Q34 32 34.5 41" fill="none" stroke="#4a4136" stroke-width="1.4"/>

  <!-- boulders flanking the mouth -->
  <path d="M6 53 Q5 44 11 42 Q18 41 19 49 L19 53 Z"
        fill="#b4a897" stroke="#463a2b" stroke-width="1"/>
  <path d="M38 53 Q37 44 44 42 Q52 42 51 53 Z"
        fill="#a89a89" stroke="#463a2b" stroke-width="1"/>

  <!-- grass tufts on top -->
  <g stroke="#5b7a37" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M20 22 l-1.6 -4.5 M21.6 22 l0 -5 M23.2 22 l1.6 -4.5"/>
    <path d="M30 20.5 l-1.4 -4 M31.4 20.5 l0.2 -4.6 M32.9 20.8 l1.5 -3.8"/>
  </g>

  <!-- volume: highlight top-left, shade bottom-right -->
  <path d="M6 53 C 5 37, 11 24, 24 21 C 20 25, 16 33, 15 41 L13 53 Z"
        fill="#ffffff" opacity="0.10"/>
  <path d="M56 53 C 56 44, 53 35, 47 29 C 50 36, 51 44, 50 53 Z"
        fill="#000000" opacity="0.12"/>
</svg>
