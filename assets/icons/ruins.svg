<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Ruins — broken masonry, reclaimed by growth</title>

  <ellipse cx="31" cy="53" rx="24" ry="3.4" fill="#241c12" opacity="0.16"/>

  <!-- rubble mound at the base -->
  <path d="M5 53 Q12 47 22 48 Q32 46 42 48 Q51 47 58 53 Z"
        fill="#b3a68b" stroke="#463a2b" stroke-width="1" stroke-linejoin="round"/>

  <!-- broken lintel resting across the gap -->
  <path d="M17 18 L47 20.5 L47 26.5 L17 24 Z"
        fill="#c2b596" stroke="#463a2b" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M23 19.3 L23 24.7 M34 20.2 L34 25.6" stroke="#7d715a" stroke-width="0.8"/>

  <!-- tall wall fragment (left), jagged broken top -->
  <path d="M11 53 L11 16 L14.5 12.5 L18 15.5 L21.5 11 L25 16 L25 53 Z"
        fill="#cdc2ab" stroke="#463a2b" stroke-width="1.2" stroke-linejoin="round"/>
  <path d="M15 41 L15 30 Q15 26.5 18.5 26.5 Q22 26.5 22 30 L22 41 Z"
        fill="#2b2620" stroke="#463a2b" stroke-width="1"/>

  <!-- shorter fragment (right) -->
  <path d="M41 53 L41 26 L44 21 L47 26.5 L48.5 23 L51 28.5 L51 53 Z"
        fill="#c6baa0" stroke="#463a2b" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- a fallen block in front -->
  <path d="M27 53 L27.5 46 L38 44.5 L38.5 51.5 L30 53 Z"
        fill="#bdb096" stroke="#463a2b" stroke-width="1" stroke-linejoin="round"/>
  <path d="M27.5 46 L38 44.5 L38.2 46 L27.7 47.4 Z" fill="#ddd2ba"/>

  <!-- cracks -->
  <g stroke="#7d715a" stroke-width="0.9" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M18 44 L20 34 L18 24"/>
    <path d="M45 44 L46.5 35 L45.5 29"/>
  </g>

  <!-- vine on the left fragment -->
  <path d="M23 53 Q19 46 22.5 39 Q26 32 22.5 25"
        fill="none" stroke="#5b7a37" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="20.6" cy="43" r="1.3" fill="#6b8a3f"/>
  <circle cx="25" cy="33.5" r="1.3" fill="#6b8a3f"/>

  <!-- volume: highlight left, shade right -->
  <path d="M11 53 L11 16 L14.5 12.5 L15 14 L13.5 21 L13.5 53 Z" fill="#ffffff" opacity="0.08"/>
  <path d="M23 53 L23 15.5 L25 16 L25 53 Z" fill="#000000" opacity="0.10"/>
  <path d="M49 53 L49 27 L51 28.5 L51 53 Z" fill="#000000" opacity="0.10"/>
</svg>
