<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <title>Village — two Mongolian-style yurts (gers)</title>

  <ellipse cx="46" cy="39.5" rx="12" ry="2.1" fill="#241c12" opacity="0.13"/>
  <ellipse cx="28" cy="53.5" rx="23" ry="3.4" fill="#241c12" opacity="0.16"/>

  <!-- ===== BACK GER ===== -->
  <g stroke="#6f5d46" stroke-width="0.9" stroke-linejoin="round">
    <path d="M36 39 L37.5 27 L54.5 27 L56 39 Z" fill="#e8ded0"/>
    <path d="M35 27 Q36 19 42 16 Q46 15 50 16 Q56 19 57 27 Z" fill="#e0d6c0"/>
    <line x1="37.6" y1="29" x2="54.4" y2="29" stroke="#96543f" stroke-width="1"/>
    <path d="M42 39 L42 31 Q42 28.5 46 28.5 Q50 28.5 50 31 L50 39 Z"
          fill="#b1531f" stroke="none"/>
  </g>
  <ellipse cx="46" cy="15.8" rx="4" ry="1.4" fill="#8a5637" stroke="#5f3c26" stroke-width="0.7"/>
  <ellipse cx="46" cy="15.5" rx="2.1" ry="0.7" fill="#3f3226"/>
  <path d="M42.3 15.6 H49.7 M46 14 V17.4" stroke="#7a4d33" stroke-width="0.7"/>

  <!-- ===== FRONT GER ===== -->
  <g stroke="#463a2b" stroke-width="1.1" stroke-linejoin="round" stroke-linecap="round">
    <path d="M11.5 53 L14 40 L44 40 L46.5 53 Z" fill="#f5eee0"/>
    <path d="M12.5 40 Q13 25 23 21 Q29 19.6 35 21 Q45.5 25 45.5 40 Z" fill="#efe7d4"/>
    <line x1="12.7" y1="42" x2="45.3" y2="42" stroke="#a9553b" stroke-width="1.7"/>
    <line x1="13" y1="44.4" x2="45" y2="44.4" stroke="#a9553b" stroke-width="1"/>
    <path d="M22 53 L22 46 Q22 42 29 42 Q36 42 36 46 L36 53 Z" fill="#8a5637"/>
    <path d="M23.7 53 L23.7 46.4 Q23.7 43.4 29 43.4 Q34.3 43.4 34.3 46.4 L34.3 53 Z"
          fill="#c25e2f" stroke="none"/>
  </g>

  <!-- roof lashing ropes -->
  <g stroke="#3a2f22" stroke-width="0.9" opacity="0.14" stroke-linecap="round" fill="none">
    <path d="M24 21 Q15 30 13.5 39"/>
    <path d="M29 20 L29 40"/>
    <path d="M34 21 Q43 30 44.5 39"/>
  </g>

  <!-- volume: shade right, highlight left -->
  <path d="M35 21 Q45.5 25 45.5 40 L46.5 53 L40.5 53 L40 40 L35.5 21.3 Z" fill="#000000" opacity="0.10"/>
  <path d="M23 21 Q13 25 12.5 40 L16 40 Q17 27 24.5 21.6 Z" fill="#ffffff" opacity="0.09"/>

  <!-- door detail -->
  <rect x="24.6" y="44" width="3.4" height="8.6" rx="1" fill="#d47a4a"/>
  <g stroke="#7c3c20" stroke-linecap="round">
    <line x1="29" y1="43.6" x2="29" y2="52.4" stroke-width="0.9"/>
    <line x1="24.7" y1="48.3" x2="33.3" y2="48.3" stroke-width="0.8"/>
  </g>
  <circle cx="26.7" cy="49.9" r="0.7" fill="#f0c39a"/>
  <circle cx="31.3" cy="49.9" r="0.7" fill="#8a3d1e"/>

  <!-- front crown (toono) -->
  <ellipse cx="29" cy="21" rx="5.6" ry="1.8" fill="#8a5637" stroke="#5f3c26" stroke-width="0.9"/>
  <ellipse cx="29" cy="20.6" rx="3" ry="1" fill="#3f3226"/>
  <path d="M24 20.8 H34 M29 18.6 V23.4 M25.6 19 L32.4 22.6 M32.4 19 L25.6 22.6"
        stroke="#7a4d33" stroke-width="0.85"/>
</svg>
