<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>the-bug</title>

    <!-- Trunk builds the `the-bug` binary to wasm and injects the loader. -->
    <link data-trunk rel="rust" data-bin="the-bug" data-wasm-opt="s" />

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0d0d0d;
        }

        canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font: 14px system-ui, sans-serif;
        }
    </style>
</head>

<body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading">loading the-bug…</div>

    <script>
        // Hide the loading text once the canvas has been painted.
        const canvas = document.getElementById("the_canvas_id");
        const loading = document.getElementById("loading");
        const observer = new MutationObserver(() => {
            if (canvas.width > 0) {
                loading.remove();
                observer.disconnect();
            }
        });
        observer.observe(canvas, { attributes: true });
    </script>
</body>

</html>
