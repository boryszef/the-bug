[package]
name = "the-bug"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
# The graphical (egui/eframe) front end — the actively developed one.
gui = ["dep:eframe"]
# The legacy terminal (ratatui) front end. Frozen: kept buildable, not
# developed. Build with `--no-default-features --features tui`.
tui = ["dep:ratatui", "dep:crossterm"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
eframe = { version = "0.36.1", optional = true }
fluent = "0.17.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
rand = "0.10.2"
ratatui = { version = "0.30.2", optional = true }
rust-embed = "8.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unic-langid = "0.9.6"
