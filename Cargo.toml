[package]
name = "the-bug"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/boryszef/the-bug"

# The shared core (game/viewmodel/save/i18n/mapgen) is a library so the
# functional test suite in `tests/` can drive it through its public API —
# see docs/adr/0003-library-target-for-functional-tests.md. The front end
# stays a single binary (`src/main.rs`) that consumes this lib.
[lib]
path = "src/lib.rs"

# cucumber-rs runs its scenarios from its own binary, not libtest.
[[test]]
name = "cucumber"
harness = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
eframe = "0.36.1"
fluent = "0.17.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system", "desktop-requester"] }
i18n-embed-fl = "0.10.1"
# Decodes the bundled POI icon PNGs (docs/icons.md). `eframe` already pulls
# this crate in with the same feature set, so it costs no extra build.
image = { version = "0.25.10", default-features = false, features = ["png"] }
rand = "0.10.2"
# `debug-embed`: embed the `.ftl` locales in debug builds too (release
# already does) — a debug wasm build has no filesystem to read them from.
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unic-langid = "0.9.6"
# `std::time::Instant` on native; `performance.now()`-backed on wasm, where
# `std::time::Instant::now()` aborts. Drop-in — see docs/adr/0005-web-build.md.
web-time = "1.1"

[dev-dependencies]
cucumber = "0.23.0"
pollster = "0.4.0"

# The web build (`trunk build` / `trunk serve`) — see docs/adr/0005-web-build.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "Navigator"] }
# `rand`'s RNG (mapgen, search, hunt) needs the browser backend on wasm; also
# needs `--cfg getrandom_backend="wasm_js"` from .cargo/config.toml.
getrandom = { version = "0.4", features = ["wasm_js"] }
