# prek configuration — runs Rust checks on every commit.
# https://prek.j178.dev
#
# One-time setup:
#   cargo install prek   # installs the `prek` binary into ~/.cargo/bin
#   prek install         # installs the git pre-commit hook in this repo
#
# Run manually:  prek run --all-files
# Skip once:     git commit --no-verify
#
#:schema https://www.schemastore.org/prek.json

# clippy runs once per front end: the shared layers are linted under both,
# so a change that breaks the frozen `tui` build is caught at commit time.
[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all -- --check", language = "system", types = ["rust"], pass_filenames = false },
    { id = "cargo-clippy-gui", name = "cargo clippy (gui)", entry = "cargo clippy --all-targets -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },
    { id = "cargo-clippy-tui", name = "cargo clippy (tui)", entry = "cargo clippy --all-targets --no-default-features --features tui -- -D warnings", language = "system", types = ["rust"], pass_filenames = false },
]
