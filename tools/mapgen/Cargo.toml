[package]
name = "mapgen"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone dev tool, not shipped with the game (see ../../docs/mapgen.md). The
# empty [workspace] table makes this crate its own workspace root so cargo never
# ties it to the repo above, even if a [workspace] is later added there.
[workspace]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.10.2"
